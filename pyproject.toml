[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bolzakit"
version = "0.2.0"
description = "Exact and provenance-labelled computations on the Bolza surface (genus-2 hyperbolic surface)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gordon Speagle"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mpmath>=1.3"]
classifiers = ["Programming Language :: Python :: 3",
               "Topic :: Scientific/Engineering :: Mathematics", "Topic :: Scientific/Engineering :: Physics"]

[project.optional-dependencies]
sym = ["sympy>=1.12"]
pari = ["cypari2>=2.2"]
flint = ["python-flint>=0.6"]
cert = ["python-flint>=0.6", "sympy>=1.12"]
skfem = ["scikit-fem>=9"]
dev = ["pytest>=7", "sympy>=1.12", "scikit-fem>=9", "python-flint>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bolzakit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
