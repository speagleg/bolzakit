name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
jobs:
  test:
    # Fast suite. Never downloads: network tests run only if the Strohmaier–Uski file is already cached.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one Python version failing must not cancel the others
      matrix: {python: ["3.10", "3.11", "3.12", "3.13"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev,cert,skfem]"
      - run: pytest -q
      - name: Check the golden certificates
        # bolzakit_check exits 0 (all unconditionally VALID), 2 (no INVALID, some only conditionally VALID) or
        # 1 (some INVALID). The golden set is expected to exit 2 (six conditional files): lp_B_3.3_4.0 is
        # conditional on lambda_1 >= 3.3, lg_lower_n48 on lambda_4 >= 4.0, and the four first_order / kyfan
        # certificates on their lambda_1 ball and lambda_4 >= 4.0, all discharged by hand by other certificates.
        shell: bash
        run: |
          set +e
          python -m bolzakit_check proofs/bolza-local-max/certificates/*.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then echo "checker exit $rc: OK"; else echo "checker exit $rc: FAIL"; exit 1; fi
  slow:
    # Weekly (and on demand): slow tests, the Strohmaier–Uski download and network tests, and the proof package's
    # quick reproduction (checker on the golden set plus the n <= 24 analogues). --runslow also runs the gyro-trim
    # example (tests/test_examples.py) and the quick frequency benchmark (tests/test_frequency_benchmark.py; the
    # pyMOTO row is skipped because pymoto is benchmark-only and never installed in CI).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,cert,skfem,pari]"
      - run: pytest -q --runslow --runnetwork
      - run: python proofs/bolza-local-max/reproduce.py --quick
