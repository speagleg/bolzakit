name: lean
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build
        working-directory: lean
        run: lake build
      - name: Axiom gate
        working-directory: lean
        # shell: bash runs with -eo pipefail, so a failing `lean` is not masked by `tee`
        shell: bash
        run: |
          lake env lean BolzaKit/LocalMax.lean 2>&1 | tee axioms.log
          bash ../scripts/check_axioms.sh axioms.log
      - name: Check no sorry
        run: bash scripts/check_no_sorry.sh
